<!--
  Install PostHog on a Shopify storefront: the theme snippet
  Guide: https://99ways.io/how-we-installed-posthog-on-shopify-and-captured-all-events/
  Paste before </head> in layout/theme.liquid, on an unpublished copy of the live theme first.
  It starts PostHog only after Shopify's Customer Privacy API allows analytics, and writes the
  visitor's PostHog ID to the ph_storefront_id cookie, which the custom pixel reads so checkout
  events join the same visitor.
  The loader below is PostHog's snippet loader; prefer the one your project shows. Replace
  YOUR_POSTHOG_PROJECT_TOKEN, set your region's host, and add the `defaults` date from your
  project's snippet to posthog.init.
-->

// Keep the loader from your project snippet above this code.
window.analyticsConsent = new Promise(resolve => {
  window.allowAnalytics = resolve;
});

window.Shopify.loadFeatures([
  { name: 'consent-tracking-api', version: '0.2' },
], error => {
  if (error) return;
  const privacy = window.Shopify.customerPrivacy;
  let client;
  let started = false;
  let pageviewSent = false;

  window.refreshPostHogBridge = function () {
    if (!client || !privacy.analyticsProcessingAllowed()
        || client.has_opted_out_capturing()) return;
    document.cookie = 'ph_storefront_id='
      + encodeURIComponent(client.get_distinct_id())
      + '; Path=/; SameSite=Lax; Secure';
  };

  function syncConsent() {
    if (!privacy.analyticsProcessingAllowed()) {
      if (client) client.opt_out_capturing();
      document.cookie = 'ph_storefront_id=; Max-Age=0; Path=/; SameSite=Lax; Secure';
      return;
    }
    if (!started) {
      started = true;
      posthog.init('YOUR_POSTHOG_PROJECT_TOKEN', {
        api_host: 'https://eu.i.posthog.com', // Use your project's host.
        // Retain the defaults option from your copied snippet here.
        person_profiles: 'identified_only',
        opt_out_capturing_by_default: true,
        opt_out_persistence_by_default: true,
        capture_pageview: false,
        loaded: function (ph) {
          client = ph;
          syncConsent();
        },
      });
      return;
    }
    if (!client) return;
    if (client.has_opted_out_capturing()) client.opt_in_capturing();
    window.allowAnalytics();
    window.refreshPostHogBridge();
    if (!pageviewSent) {
      client.capture('$pageview');
      pageviewSent = true;
    }
  }

  document.addEventListener('visitorConsentCollected', syncConsent);
  syncConsent();
});
</script>
