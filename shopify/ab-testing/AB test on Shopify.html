<!--
  A/B test a Shopify storefront with PostHog
  Guide: https://99ways.io/how-to-setup-posthog-a-b-test-on-shopify/
  1. Build the variant elements on the page and hide them with the CSS below.
  2. Paste the script after the PostHog snippet; the flag key must match your PostHog experiment.
  3. Preview each variant by adding ?<flag-key>=<variant> to the page URL, for example:
     https://example.com/products/example-product?026-product-page-description-key-points=test
  The runner is posthog-page-experiments (https://github.com/99ways-io/posthog-page-experiments):
  it checks that the page can show the change before recording an exposure, applies the assigned
  variant with !important styles, and falls back to control. isEligible waits for
  window.analyticsConsent, which the install snippets' consent code defines.
  On Shopify, build and preview the test on an unpublished copy of the live theme (add
  preview_theme_id=<theme id> to the preview URL), and mark the two containers with
  data-experiment-control and data-experiment-test.
-->
<style>
[data-experiment-test] {
  display: none !important;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@99ways/posthog-page-experiments@0.2.0/dist/posthog-page-experiments.min.js"></script>
<script>
window.runExperiment('026-product-page-description-key-points', {
  isEligible: async () => {
    // A URL preview reads no flag, so only measured visits wait for consent.
    if (!new URLSearchParams(location.search).has('026-product-page-description-key-points')) {
      await window.analyticsConsent
    }
    return ["[data-experiment-control]", "[data-experiment-test]"].every(selector =>
      document.querySelectorAll(selector).length === 1
    )
  },

  variants: {
    control: [],
    test: [
      {
        selector: '[data-experiment-control]',
        updates: { style: { display: 'none' } },
      },
      {
        selector: '[data-experiment-test]',
        updates: { style: { display: 'block' } },
      },
    ],
  },
}).catch(error => console.error('Experiment error:', error))
</script>
