<script>
window.analyticsConsent = new Promise(resolve => {
  window.allowAnalytics = resolve;
});

function onAnalyticsConsentChange(hasConsented) {
  if (hasConsented) {
    posthog.opt_in_capturing({ captureEventName: false });

  } else {
    posthog.opt_out_capturing();

}
